version: '3.8'

services:
  # Operations console — the UI. Standard library only, so it comes up even
  # when every optional dependency is missing.
  console:
    build: .
    container_name: payment-console
    ports:
      - "8080:8080"
    command: python web/server.py 8080
    environment:
      - PYTHONPATH=/app
      # Optional: enables the incident advisor. Without it the agent detects,
      # decides and acts exactly the same, just without written commentary.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      # /health reports 503 when the agent's cycle thread has died, so a
      # container that serves pages but has stopped thinking is not "healthy".
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Streamlit dashboard — the original UI, kept for comparison.
  dashboard:
    build: .
    container_name: payment-dashboard
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - PYTHONPATH=/app
    profiles:
      - legacy # Only runs when: docker-compose --profile legacy up
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI REST API
  api:
    build: .
    container_name: payment-api
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Agent Demo (optional - for running demos)
  agent:
    build: .
    container_name: payment-agent
    command: python main.py --mode demo
    environment:
      - PYTHONPATH=/app
    profiles:
      - demo # Only runs when: docker-compose --profile demo up
    volumes:
      - ./config:/app/config:ro
