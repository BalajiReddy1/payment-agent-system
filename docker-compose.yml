services:
  # Product frontend — proxies requests to the API so browsers never need CORS configuration.
  frontend:
    build: ./frontend
    container_name: payment-frontend
    ports:
      - "3000:3000"
    environment:
      - AGENT_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # FastAPI owns the payment-agent loop and its read model.
  api:
    build: .
    container_name: payment-api
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONPATH=/app
      # Optional, forwarded from the local shell. Do not commit credentials or
      # expose them to the frontend.
      # Written commentary on incidents; the agent runs without it if unset.
      - GEMINI_API_KEY
      # Read-only Razorpay test-mode source.
      - RAZORPAY_TEST_KEY_ID
      - RAZORPAY_TEST_KEY_SECRET
      - RAZORPAY_MERCHANT_ID
      - RAZORPAY_API_BASE_URL
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
