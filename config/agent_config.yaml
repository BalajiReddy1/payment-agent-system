# Agent Configuration
# Controls the core behavior of the Payment Agent

agent:
  # Size of the sliding window for transaction analysis
  window_size_minutes: 10
  
  # How often the agent runs a full analysis cycle
  analysis_interval_seconds: 30
  
  # Automatically execute low-risk actions without approval
  auto_approve_low_risk: true

  # Pattern severity below which the agent deliberately does nothing
  min_severity_to_act: 0.3

  # How long an intervention must run before its outcome is scored
  outcome_evaluation_seconds: 300

  # Share of affected traffic deliberately left untreated, so an
  # intervention can be measured against a concurrent control group rather
  # than against "before". This is real traffic knowingly left unprotected -
  # the price of knowing whether the protection works. Set to 0 to disable.
  holdout_fraction: 0.10

# Pattern Detection Thresholds
thresholds:
  # Minimum confidence to report a pattern
  pattern_confidence: 0.4
  
  # Minimum score for an action to be considered
  action_score_minimum: 0.3
  
  # Minimum failure rate increase to detect issuer degradation
  issuer_degradation_threshold: 0.08
  
  # Retry rate above which a retry storm is detected
  retry_storm_threshold: 0.15

  # Success-rate drop that marks a payment method as fatigued
  method_fatigue_threshold: 0.20

  # Multiple of baseline p95 latency that counts as a spike
  latency_spike_threshold: 1.5

  # Occurrences of one error code in the window that form a cluster
  error_cluster_threshold: 10

# Learning Parameters
learning:
  # How quickly weights are adjusted after outcomes
  weight_adjustment_rate: 0.1
  
  # Minimum samples needed before updating weights
  min_samples_for_update: 5
  
  # Decay factor for old outcomes
  outcome_decay_factor: 0.95

# Decision Weights (must sum to 1.0)
decision_weights:
  success_rate: 0.40
  latency: 0.25
  cost: 0.20
  risk: 0.15

# Control Plane Publishing
#
# The integration surface. The agent writes each revision here; a real checkout
# service reads it and routes accordingly. That is the whole contract - the
# agent never calls the payment service, so an outage on either side degrades
# to "the last known policy stays in force" rather than to inconsistency.
#
# Readers use src/control/publish.py:PolicyClient, which keeps the last good
# policy when a read fails. Set publish_path to empty to disable.
control_plane:
  publish_path: data/policy.json

  # How often the document is rewritten even when nothing changed. A reader
  # treats a document older than three of these as stale, so a crashed agent
  # is distinguishable from a quiet one.
  refresh_seconds: 30

# Incident Advisor (the slow lane)
#
# The deterministic lane detects, scores and acts on its own; the advisor is
# asked only to write the assessment a human reads on the incident. It runs
# once per incident, not once per cycle, and it is given no tools - a second
# path to change payment routing would bypass the ranking, the authorization
# tiers and the holdout measurement.
#
# If no API key is set or the SDK is not installed, the agent simply runs
# without commentary. Set enabled to false to switch the lane off even when a
# model is reachable, e.g. where sending incident detail to a provider is not
# acceptable.
advisor:
  enabled: true
  model: gemini-3.6-flash

  # Tried in order when the primary is temporarily unavailable. A flagship
  # model under load returns 503 often enough that relying on one alone is a
  # visible failure mode during a demo. The desk names whichever answered.
  fallbacks:
    - gemini-3.5-flash

  # Low on purpose: this is an explanation, not a brainstorm.
  temperature: 0.2

  # Assessments render inline on an incident card, so an essay is worse
  # than a sentence. Trimming falls back to the last complete sentence, so
  # this is a ceiling rather than an exact cut.
  max_chars: 800

# Logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
